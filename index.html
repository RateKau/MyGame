<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>Web RPG</title>
  <!-- テーマCSSを読み込み -->
  <link rel="stylesheet" href="theme.css">
  <style>
    body {
      margin:0;
      font-family:sans-serif;
      background: linear-gradient(var(--bg1), var(--bg2));
      color: var(--text-main);
    }

    #enemy {
      position:absolute;
      top:50%;
      left:50%;
      transform:translate(-50%,-50%);
      width:200px; height:200px;
      background: var(--card);
      border:2px solid var(--muted);
    }

    .bar {
      height:20px;
      position:relative;
      background: var(--card);
      border:1px solid var(--muted);
      border-radius: 4px;
    }

    .fill {
      height:100%;
      width:100%;
      background: var(--hp-green1);
      border-radius: 4px;
      transition: width 0.2s;
    }

    .text {
      position:absolute;
      top:0; left:50%;
      transform:translateX(-50%);
      color: var(--text-main);
      font-size:14px;
      font-weight: bold;
    }

    #gold {
      position:absolute;
      top:10px;
      left:50%;
      transform:translateX(-50%);
      font-size:20px;
      color: var(--win);
      font-weight: bold;
    }

    #expBar {
      position:absolute;
      bottom:40px;
      left:50%;
      transform:translateX(-50%);
      width:60%;
    }

    #expFill {
      background: var(--exp-bar);
    }

    #levelText {
      position:absolute;
      bottom:65px;
      left:50%;
      transform:translateX(-50%);
      font-size:20px;
      color: var(--accent);
      font-weight: bold;
    }

    .buttonPanel {
      position:absolute;
      right:10px;
      top:100px;
      display:flex;
      flex-direction:column;
      gap:10px;
    }

    button {
      background: var(--btn);
      color: var(--text-main);
      border:none;
      padding:10px;
      border-radius:6px;
      font-weight:bold;
      cursor:pointer;
      transition: 0.2s;
    }

    button:hover {
      opacity: 0.85;
    }

    .menuScreen {
      display:none;
      position:absolute;
      top:50%;
      left:50%;
      transform:translate(-50%,-50%);
      width:40%;
      height:65%;
      background: var(--card);
      border:2px solid var(--muted);
      padding:10px;
      overflow:auto;
      color: var(--text-main);
    }

    #autoToggle {
      position:absolute;
      bottom:100px;
      left:10px;
      background: var(--btn);
      color: var(--text-main);
    }

    #boostInfo {
      position:absolute;
      bottom:10px;
      right:10px;
      font-size:14px;
      color: var(--accent);
    }
  </style>
</head>
<body>
  <div id="enemy"></div>
  <div id="enemyHpBar" class="bar" style="top:calc(50% - 130px); left:50%; transform:translateX(-50%); width:200px;">
    <div id="enemyHpFill" class="fill"></div>
    <div id="enemyHpText" class="text"></div>
  </div>
  <div id="gold">Gold: 0</div>
  <div id="levelText">Lv 1</div>
  <div id="expBar" class="bar">
    <div id="expFill" class="fill"></div>
    <div id="expText" class="text"></div>
  </div>
  <button id="autoToggle">Auto: OFF</button>
  <div id="boostInfo"></div>

  <div class="buttonPanel">
    <button id="upgradeBtn">アップグレード</button>
    <button id="craftBtn">クラフト</button>
    <button id="fishBtn">釣り</button>
    <button id="inventoryBtn">インベントリ</button>
    <button id="rewardBtn">リワード</button>
  </div>

  <!-- メニュー画面はそのまま -->
  <div id="upgradeMenu" class="menuScreen">
    <h2>アップグレード</h2>
    <p>ポイント: <span id="upgradePoints">0</span></p>
    <button id="resetUpgradesBtn">リセット(50G)</button><br><br>
    <button id="buyAutoAttack">自動攻撃購入</button><br>
    <button id="buyAttackPower">攻撃力アップ</button><br>
    <button id="buyAttackSpeed">自動攻撃速度アップ</button><br>
    <button id="buyGoldBoost">ゴールドブースト</button>
    <br><br><button onclick="closeMenus()">閉じる</button>
  </div>

  <div id="craftMenu" class="menuScreen">
    <h2>クラフト</h2>
    <button id="craftRod">釣竿(1000G)</button><br>
    <button id="craftSword">石の剣(150G+木5+石9)</button>
    <br><br><button onclick="closeMenus()">閉じる</button>
  </div>

  <div id="fishMenu" class="menuScreen">
    <h2>釣り</h2>
    <div id="fishArea" style="margin:20px auto;width:100px;height:100px;border-radius:50%;background:lightblue;"></div>
    <button id="fishStart">釣る！</button>
    <div id="fishBar" style="display:none;margin-top:10px;">
      <p id="fishTimer">3</p>
      <button id="fishClick">連打！</button>
    </div>
    <br><button onclick="closeMenus()">閉じる</button>
  </div>

  <div id="inventoryMenu" class="menuScreen">
    <h2>インベントリ</h2>
    <div id="inventoryList"></div>
    <br><button onclick="closeMenus()">閉じる</button>
  </div>

  <div id="rewardMenu" class="menuScreen">
    <h2>リワード</h2>
    <input id="rewardInput" placeholder="コードを入力"><button id="rewardSubmit">受け取る</button>
    <div id="rewardMsg"></div>
    <br><button onclick="closeMenus()">閉じる</button>
  </div>

  <script>
    // --- 基本ステータス ---
    let gold=0, exp=0, level=1, maxLevel=200, upgradePoints=0;
    let enemyMaxHp=20, enemyHp=20;
    let upgrades={autoAttack:0, attackPower:0, attackSpeed:0, goldBoost:0};
    let autoOn=false, inventory=[], usedCodes=new Set();
    let boostEffects={point2x:0, exp2x:0, stoneSword:0};
    let autoAttackTimer=null, fishing=false;

    const goldText=document.getElementById("gold");
    const levelText=document.getElementById("levelText");
    const expFill=document.getElementById("expFill");
    const expText=document.getElementById("expText");
    const enemyHpFill=document.getElementById("enemyHpFill");
    const enemyHpText=document.getElementById("enemyHpText");
    const upgradePts=document.getElementById("upgradePoints");
    const boostInfo=document.getElementById("boostInfo");

    // --- UI更新 ---
    function updateGold(){ goldText.textContent=`Gold: ${gold}`; }
    function updateExp(){ 
      const need=level*10;
      expFill.style.width=Math.min(100,exp/need*100)+"%";
      expText.textContent=`${exp}/${need}`;
      levelText.textContent=`Lv ${level}`;
      upgradePts.textContent=upgradePoints;
    }
    function updateEnemy(){ 
      enemyHpFill.style.width=(enemyHp/enemyMaxHp*100)+"%";
      if(enemyHp/enemyMaxHp>0.5) enemyHpFill.style.background="green";
      else if(enemyHp/enemyMaxHp>0.2) enemyHpFill.style.background="yellow";
      else enemyHpFill.style.background="red";
      enemyHpText.textContent=`${enemyHp}/${enemyMaxHp}`;
    }
    updateGold(); updateExp(); updateEnemy();

    // --- 攻撃 ---
    document.getElementById("enemy").addEventListener("click",()=>{ if(!fishing) attackEnemy(); });
    function attackEnemy(){
      const base=1*Math.pow(2,upgrades.attackPower);
      const swordBoost=Math.pow(3,boostEffects.stoneSword);
      const dmg=base*swordBoost;
      enemyHp-=dmg;
      if(enemyHp<=0){
        const reward=(5*(upgrades.goldBoost+1));
        gold+=reward;
        let xp=(2*(boostEffects.exp2x>0?2:1));
        exp+=xp;
        if(exp>=level*10 && level<maxLevel){
          exp-=level*10; level++; upgradePoints+=(boostEffects.point2x>0?2:1);
          if(level%5===0) enemyMaxHp*=2;
        }
        enemyHp=enemyMaxHp;
        updateGold(); updateExp();
      }
      updateEnemy();
    }

    // --- 自動攻撃 ---
    function setAuto(){
      if(autoAttackTimer) clearInterval(autoAttackTimer);
      if(autoOn && upgrades.autoAttack>0 && !fishing){
        let spd=[3000,2500,2000,1000,500,200][upgrades.attackSpeed];
        autoAttackTimer=setInterval(attackEnemy,spd);
      }
    }
    document.getElementById("autoToggle").onclick=()=>{
      autoOn=!autoOn;
      document.getElementById("autoToggle").textContent="Auto: "+(autoOn?"ON":"OFF");
      setAuto();
    };

    // --- アップグレード購入 ---
    document.getElementById("buyAutoAttack").onclick=()=>{ if(upgrades.autoAttack==0&&upgradePoints>=1){ upgrades.autoAttack=1; upgradePoints--; setAuto(); updateExp(); }};
    document.getElementById("buyAttackPower").onclick=()=>{ if(upgradePoints>=1&&upgrades.attackPower<10){ upgrades.attackPower++; upgradePoints--; updateExp(); }};
    document.getElementById("buyAttackSpeed").onclick=()=>{ if(upgrades.autoAttack>0){ let costs=[10,10,25,50,75]; let lv=upgrades.attackSpeed; if(lv<5&&upgradePoints>=costs[lv]){ upgradePoints-=costs[lv]; upgrades.attackSpeed++; setAuto(); updateExp(); } }};
    document.getElementById("buyGoldBoost").onclick=()=>{ if(upgrades.goldBoost<5&&upgradePoints>=5){ upgradePoints-=5; upgrades.goldBoost++; updateExp(); }};
    document.getElementById("resetUpgradesBtn").onclick=()=>{ if(gold>=50){ gold-=50; upgradePoints=level; upgrades={autoAttack:0,attackPower:0,attackSpeed:0,goldBoost:0}; updateGold(); updateExp(); setAuto(); }};

    // --- メニュー制御 ---
    function closeMenus(){ document.querySelectorAll('.menuScreen').forEach(m=>m.style.display="none"); }
    document.getElementById("upgradeBtn").onclick=()=>{ closeMenus(); document.getElementById("upgradeMenu").style.display="block"; };
    document.getElementById("craftBtn").onclick=()=>{ closeMenus(); document.getElementById("craftMenu").style.display="block"; };
    document.getElementById("fishBtn").onclick=()=>{ closeMenus(); document.getElementById("fishMenu").style.display="block"; };
    document.getElementById("inventoryBtn").onclick=()=>{ closeMenus(); document.getElementById("inventoryMenu").style.display="block"; updateInventoryUI(); };
    document.getElementById("rewardBtn").onclick=()=>{ closeMenus(); document.getElementById("rewardMenu").style.display="block"; };

    // --- クラフト ---
    document.getElementById("craftRod").onclick=()=>{ if(!inventory.find(i=>i.type==="rod")&&gold>=1000){ gold-=1000; inventory.push({type:"rod",name:"釣竿"}); updateGold(); updateInventoryUI(); }};
    document.getElementById("craftSword").onclick=()=>{ let wood=inventory.filter(i=>i.type==="wood").length; let stone=inventory.filter(i=>i.type==="stone").length; if(gold>=150&&wood>=5&&stone>=9){ gold-=150; removeItem("wood",5); removeItem("stone",9); boostEffects.stoneSword++; inventory.push({type:"stoneSword",name:"石の剣"}); updateGold(); updateInventoryUI(); }};
    function removeItem(type,n){ let c=0; inventory=inventory.filter(i=>{ if(i.type===type&&c<n){ c++; return false;} return true;}); }

    // --- インベントリ ---
    const invList=document.getElementById("inventoryList");
    function updateInventoryUI(){ invList.innerHTML=""; inventory.forEach((it,idx)=>{ let b=document.createElement("button"); b.textContent=it.name; b.onclick=()=>useItem(idx); invList.appendChild(b); }); }
    function useItem(idx){ let it=inventory[idx]; if(it.type==="point2x"){ boostEffects.point2x=1800; } else if(it.type==="exp2x"){ boostEffects.exp2x=1800; } inventory.splice(idx,1); updateInventoryUI(); }

    // --- 釣り ---
    let fishStart=document.getElementById("fishStart"), fishBar=document.getElementById("fishBar"), fishClick=document.getElementById("fishClick"), fishTimer=document.getElementById("fishTimer");
    let clicks=0;
    fishStart.onclick=()=>{ if(!inventory.find(i=>i.type==="rod")){ alert("釣竿が必要"); return; } fishing=true; setAuto(); fishStart.disabled=true; let t=3; fishTimer.textContent=t; fishBar.style.display="block"; clicks=0; let countdown=setInterval(()=>{ t--; fishTimer.textContent=t; if(t<=0){ clearInterval(countdown); fishTimer.textContent="START!"; } },1000); };
    fishClick.onclick=()=>{ if(fishTimer.textContent==="START!"){ clicks++; if(clicks>=10){ endFishing(); } } };
    function endFishing(){ fishBar.style.display="none"; fishStart.disabled=false; fishing=false; setAuto(); determineFishingReward(clicks); }
    function determineFishingReward(c){ let potionBoost=Math.min(c/10,1); let r=Math.random(); let thresholds={point2x:0.15+potionBoost*0.2,exp2x:0.15+potionBoost*0.2,wood:0.35,stone:0.35}; let sum=0; for(let k in thresholds){ sum+=thresholds[k]; } r*=sum; let acc=0; let chosen=null; for(let k in thresholds){ acc+=thresholds[k]; if(r<=acc){ chosen=k; break; } } let item; if(chosen==="point2x") item={type:"point2x",name:"Pt2倍ポーション"}; else if(chosen==="exp2x") item={type:"exp2x",name:"Exp2倍ポーション"}; else if(chosen==="wood") item={type:"wood",name:"木材"}; else item={type:"stone",name:"石"}; inventory.push(item); updateInventoryUI(); alert(item.name+"を釣りました！"); }

    // --- リワード ---
    document.getElementById("rewardSubmit").onclick=()=>{ let code=document.getElementById("rewardInput").value.trim(); if(usedCodes.has(code)){ document.getElementById("rewardMsg").textContent="既に使用済みです"; return; } if(code==="RPG"){ gold+=250; updateGold(); usedCodes.add(code); document.getElementById("rewardMsg").textContent="Gold+250!"; } else if(code==="SecretCode"){ inventory.push({type:"stoneSword",name:"石の剣"}); inventory.push({type:"stoneSword",name:"石の剣"}); boostEffects.stoneSword+=2; upgradePoints+=5; exp+=500; updateExp(); updateInventoryUI(); usedCodes.add(code); document.getElementById("rewardMsg").textContent="石の剣×2 + Pt+5 + Exp+500"; } else { document.getElementById("rewardMsg").textContent="無効なコード"; } };

    // --- ブーストタイマー更新 ---
    setInterval(()=>{ for(let k in boostEffects){ if(boostEffects[k]>0) boostEffects[k]--; } let msgs=[]; if(boostEffects.point2x>0) msgs.push("Pt2x:"+boostEffects.point2x+"s"); if(boostEffects.exp2x>0) msgs.push("Exp2x:"+boostEffects.exp2x+"s"); boostInfo.textContent=msgs.join(" "); },1000);
  </script>
</body>
</html>
