<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>シンプルRPG+</title>
<style>
  body { font-family:sans-serif; background:linear-gradient(to bottom,#dfe9f3,#ffffff); margin:0; padding:0; text-align:center; }
  #gameContainer{ max-width:800px; margin:0 auto; padding:20px; }
  button{ margin:5px; padding:10px; border-radius:8px; border:none; cursor:pointer; background:#4a90e2; color:white; }
  button:disabled{ background:#999; }
  #enemy{ width:100px; height:100px; background:linear-gradient(45deg,#fff,#ccc); margin:20px auto; line-height:100px; }
  #menuButtons{ position:fixed; right:10px; top:50%; transform:translateY(-50%); display:flex; flex-direction:column; }
  .menuScreen{ display:none; position:fixed; top:50%; left:50%; transform:translate(-50%,-50%); background:white; border:2px solid #333; padding:20px; }
  #boostDisplay{ position:fixed; right:10px; bottom:10px; background:rgba(0,0,0,0.6); color:white; padding:10px; border-radius:8px; }
  #autoAttackToggle{ position:fixed; left:10px; top:50%; transform:translateY(-50%); background:#e67e22; }
</style>
</head>
<body>
<div id="gameContainer">
  <h1>シンプルRPG+</h1>
  <div id="enemy">敵</div>
  <p>HP: <span id="enemyHp"></span></p>
  <button id="attackBtn">攻撃</button>
  <p>Gold: <span id="gold">0</span> | Exp: <span id="exp">0</span> | Lv: <span id="level">1</span></p>
  <p>アップグレードポイント: <span id="upgradePoints">0</span></p>
</div>

<div id="menuButtons">
  <button id="openUpgrades">アップグレード</button>
  <button id="openCraft">クラフト</button>
  <button id="openFishing">釣り</button>
  <button id="openInventory">インベントリ</button>
  <button id="openReward">リワード</button>
</div>
<button id="autoAttackToggle">自動攻撃 OFF</button>
<div id="boostDisplay"></div>

<!-- アップグレード -->
<div id="upgradeMenu" class="menuScreen">
  <h2>アップグレード</h2>
  <div id="upgradeList"></div>
  <button id="resetUpgrades">アップグレードリセット (50G)</button><br>
  <button onclick="closeMenu('upgradeMenu')">閉じる</button>
</div>

<!-- クラフト -->
<div id="craftMenu" class="menuScreen">
  <h2>クラフト</h2>
  <div id="craftList"></div>
  <button onclick="closeMenu('craftMenu')">閉じる</button>
</div>

<!-- 釣り -->
<div id="fishingMenu" class="menuScreen">
  <h2>釣り</h2>
  <button id="startFishing">釣りを始める</button>
  <p id="fishingInfo"></p>
  <button id="fishAction" disabled>釣る！</button>
  <button onclick="closeMenu('fishingMenu')">閉じる</button>
</div>

<!-- インベントリ -->
<div id="inventoryMenu" class="menuScreen">
  <h2>インベントリ</h2>
  <div id="inventoryList"></div>
  <button onclick="closeMenu('inventoryMenu')">閉じる</button>
</div>

<!-- リワード -->
<div id="rewardMenu" class="menuScreen">
  <h2>リワード</h2>
  <input type="text" id="rewardCode" placeholder="コードを入力">
  <button id="claimReward">受け取る</button>
  <p id="rewardMessage"></p>
  <button onclick="closeMenu('rewardMenu')">閉じる</button>
</div>

<script>
let gold=0, exp=0, level=1, upgradePoints=0;
let upgrades={attack:0,gold:0,attackSpeed:0};
let attackDamage=1, goldMultiplier=1;
let autoAttackEnabled=false;
let hasRod=false;
let inventory=[];
let boostEffects={point2x:0,exp2x:0};
let resources={wood:0,stone:0,stoneSword:0};

let enemyMaxHp=20, enemyHp=20;

const enemyHpSpan=document.getElementById("enemyHp");
const goldSpan=document.getElementById("gold");
const expSpan=document.getElementById("exp");
const levelSpan=document.getElementById("level");
const upgradePointsSpan=document.getElementById("upgradePoints");
const boostDisplay=document.getElementById("boostDisplay");
const autoAttackBtn=document.getElementById("autoAttackToggle");

function updateGold(){ goldSpan.textContent=gold; }
function updateExp(){ expSpan.textContent=exp; levelSpan.textContent=level; }
function updateUpgradePoints(){ upgradePointsSpan.textContent=upgradePoints; }
function updateEnemyHp(){ enemyHpSpan.textContent=enemyHp+"/"+enemyMaxHp; }

// 攻撃
function attackEnemy(){
  if(enemyHp<=0) return;
  enemyHp-=attackDamage;
  updateEnemyHp();
  if(enemyHp<=0){
    let g=Math.floor(5*goldMultiplier*(boostEffects.point2x>0?2:1));
    gold+=g;
    exp+=5*(boostEffects.exp2x>0?2:1);
    if(exp>=level*20){ exp=0; level++; upgradePoints++; }
    enemyMaxHp+=5; enemyHp=enemyMaxHp;
    updateGold(); updateExp(); updateUpgradePoints(); updateEnemyHp();
  }
}
document.getElementById("attackBtn").onclick=attackEnemy;

// 自動攻撃
autoAttackBtn.onclick=()=>{
  autoAttackEnabled=!autoAttackEnabled;
  autoAttackBtn.textContent=autoAttackEnabled?"自動攻撃 ON":"自動攻撃 OFF";
};
setInterval(()=>{
  if(autoAttackEnabled && !fishingActive) attackEnemy();
},1000);

// アップグレード
const upgradeList=document.getElementById("upgradeList");
function renderUpgrades(){
  upgradeList.innerHTML="";
  [["attack","攻撃力 +1"],["gold","Gold倍率 +0.5"],["attackSpeed","攻撃速度 +0.5秒短縮"]].forEach(([key,label])=>{
    let btn=document.createElement("button");
    btn.textContent=label+" (コスト:1)";
    btn.onclick=()=>{
      if(upgradePoints>0){
        upgrades[key]++; upgradePoints--;
        if(key==="attack") attackDamage++;
        if(key==="gold") goldMultiplier+=0.5;
      }
      updateUpgradePoints(); renderUpgrades();
    };
    upgradeList.appendChild(btn);
  });
}
document.getElementById("openUpgrades").onclick=()=>{ renderUpgrades(); document.getElementById("upgradeMenu").style.display="block"; };
document.getElementById("resetUpgrades").onclick=()=>{
  if(gold>=50){
    gold-=50;
    upgradePoints=upgrades.attack+upgrades.gold+upgrades.attackSpeed;
    upgrades={attack:0,gold:0,attackSpeed:0};
    attackDamage=1; goldMultiplier=1;
    updateGold(); updateUpgradePoints(); renderUpgrades();
  }
};

// クラフト
const craftList=document.getElementById("craftList");
function renderCraft(){
  craftList.innerHTML="";
  // 釣竿
  let rodBtn=document.createElement("button");
  rodBtn.textContent="釣竿 (1000G, 木10, 石5)";
  rodBtn.disabled=hasRod || gold<1000 || resources.wood<10 || resources.stone<5;
  rodBtn.onclick=()=>{ if(!hasRod && gold>=1000 && resources.wood>=10 && resources.stone>=5){ gold-=1000; resources.wood-=10; resources.stone-=5; hasRod=true; updateGold(); renderCraft(); } };
  craftList.appendChild(rodBtn);
  // 石の剣
  let swordBtn=document.createElement("button");
  swordBtn.textContent="石の剣 (150G, 木5, 石9)";
  swordBtn.disabled=gold<150 || resources.wood<5 || resources.stone<9;
  swordBtn.onclick=()=>{ gold-=150; resources.wood-=5; resources.stone-=9; resources.stoneSword++; goldMultiplier*=3; updateGold(); renderCraft(); };
  craftList.appendChild(swordBtn);
}
document.getElementById("openCraft").onclick=()=>{ renderCraft(); document.getElementById("craftMenu").style.display="block"; };

// 釣り
let fishingActive=false;
let clicks=0;
document.getElementById("startFishing").onclick=()=>{
  if(!hasRod){ alert("釣竿をクラフトしてください！"); return; }
  fishingActive=true; clicks=0;
  document.getElementById("fishAction").disabled=false;
  document.getElementById("fishingInfo").textContent="連打で釣れ！";
  setTimeout(endFishing,3000);
};
document.getElementById("fishAction").onclick=()=>{ clicks++; };

function endFishing(){
  fishingActive=false;
  document.getElementById("fishAction").disabled=true;
  determineFishingReward(clicks);
}
function determineFishingReward(clicks){
  let baseRoll=Math.random();
  // レア補正
  if(clicks>=10) baseRoll*=0.5; // クリック多いとポーション系が当たりやすい
  if(baseRoll<0.15){ inventory.push({type:"point2x",name:"アップグレードポイント2倍ブーストポーション"}); }
  else if(baseRoll<0.30){ inventory.push({type:"exp2x",name:"Exp2倍ブーストポーション"}); }
  else if(baseRoll<0.65){ resources.wood++; alert("木材を釣った！ 現在:"+resources.wood); return; }
  else { resources.stone++; alert("石を釣った！ 現在:"+resources.stone); return; }
  updateInventoryUI();
  alert("釣り成功! "+inventory[inventory.length-1].name+" を獲得しました！");
}

// インベントリ
const inventoryList=document.getElementById("inventoryList");
function updateInventoryUI(){
  inventoryList.innerHTML="";
  inventory.forEach((item,idx)=>{
    let btn=document.createElement("button");
    btn.textContent=item.name;
    btn.onclick=()=>useItem(idx);
    inventoryList.appendChild(btn);
  });
}
function useItem(idx){
  let item=inventory[idx];
  if(item.type==="point2x") boostEffects.point2x=1800;
  if(item.type==="exp2x") boostEffects.exp2x=1800;
  inventory.splice(idx,1); updateInventoryUI();
  alert(item.name+" を使用しました！");
}

// ブースト残り時間
setInterval(()=>{
  for(let k in boostEffects) if(boostEffects[k]>0) boostEffects[k]--;
  let t="";
  if(boostEffects.point2x>0) t+="ポイント2倍:"+Math.floor(boostEffects.point2x/60)+"分 ";
  if(boostEffects.exp2x>0) t+="Exp2倍:"+Math.floor(boostEffects.exp2x/60)+"分";
  boostDisplay.textContent=t;
},1000);

// リワード
let usedCodes=new Set();
document.getElementById("claimReward").onclick=()=>{
  let code=document.getElementById("rewardCode").value.trim();
  if(usedCodes.has(code)){ document.getElementById("rewardMessage").textContent="このコードは使用済みです"; return; }
  if(code==="RPG"){ gold+=250; updateGold(); document.getElementById("rewardMessage").textContent="250ゴールド獲得！"; usedCodes.add(code); }
  else if(code==="SecretCode"){ resources.stoneSword+=2; goldMultiplier*=9; upgradePoints+=5; exp+=500; updateGold(); updateExp(); updateUpgradePoints(); document.getElementById("rewardMessage").textContent="石の剣×2, Exp500, ポイント5を獲得！"; usedCodes.add(code); }
  else document.getElementById("rewardMessage").textContent="無効なコードです";
};

// メニュー制御
function closeMenu(id){ document.getElementById(id).style.display="none"; }
document.getElementById("openInventory").onclick=()=>{ updateInventoryUI(); document.getElementById("inventoryMenu").style.display="block"; };
document.getElementById("openFishing").onclick=()=>{ document.getElementById("fishingMenu").style.display="block"; };
document.getElementById("openReward").onclick=()=>{ document.getElementById("rewardMenu").style.display="block"; };

updateGold(); updateExp(); updateUpgradePoints(); updateEnemyHp();
</script>
</body>
</html>
